# NetSentry SLO burn-rate rules (generated by `netsentry slo`; do not hand-edit).
#
# SLO: alerts / scored flows <= 4.624% over a rolling compliance period.
# Each alert requires BOTH a long measurement window and a short confirmation window
# to exceed the burn threshold, so a resolved incident stops paging promptly.
groups:
  - name: netsentry-slo-recording
    rules:
      - record: netsentry:alert_ratio:rate5m
        expr: >
          sum(rate(netsentry_predictions_total{decision="attack"}[5m]))
          / clamp_min(sum(rate(netsentry_predictions_total[5m])), 1e-9)
      - record: netsentry:alert_ratio:rate30m
        expr: >
          sum(rate(netsentry_predictions_total{decision="attack"}[30m]))
          / clamp_min(sum(rate(netsentry_predictions_total[30m])), 1e-9)
      - record: netsentry:alert_ratio:rate1h
        expr: >
          sum(rate(netsentry_predictions_total{decision="attack"}[1h]))
          / clamp_min(sum(rate(netsentry_predictions_total[1h])), 1e-9)
      - record: netsentry:alert_ratio:rate2h
        expr: >
          sum(rate(netsentry_predictions_total{decision="attack"}[2h]))
          / clamp_min(sum(rate(netsentry_predictions_total[2h])), 1e-9)
      - record: netsentry:alert_ratio:rate6h
        expr: >
          sum(rate(netsentry_predictions_total{decision="attack"}[6h]))
          / clamp_min(sum(rate(netsentry_predictions_total[6h])), 1e-9)
      - record: netsentry:alert_ratio:rate1d
        expr: >
          sum(rate(netsentry_predictions_total{decision="attack"}[1d]))
          / clamp_min(sum(rate(netsentry_predictions_total[1d])), 1e-9)
      - record: netsentry:alert_ratio:rate3d
        expr: >
          sum(rate(netsentry_predictions_total{decision="attack"}[3d]))
          / clamp_min(sum(rate(netsentry_predictions_total[3d])), 1e-9)
  - name: netsentry-slo-burn
    rules:
      - alert: AlertBudgetBurn14_4x
        expr: >
          netsentry:alert_ratio:rate1h > 0.665849
          and netsentry:alert_ratio:rate5m > 0.665849
        labels:
          severity: page
          long_window: 1h
          short_window: 5m
        annotations:
          summary: "Alert budget burning 14.4x too fast (1h/5m)"
          description: >
            The alert ratio over 1h (confirmed over 5m) exceeds
            66.585%, which is 14.4x the sustainable
            rate for a 4.624% budget. At this burn the full compliance
            period's budget is gone in 0.1 hours of window-equivalents.
      - alert: AlertBudgetBurn6x
        expr: >
          netsentry:alert_ratio:rate6h > 0.277437
          and netsentry:alert_ratio:rate30m > 0.277437
        labels:
          severity: page
          long_window: 6h
          short_window: 30m
        annotations:
          summary: "Alert budget burning 6x too fast (6h/30m)"
          description: >
            The alert ratio over 6h (confirmed over 30m) exceeds
            27.744%, which is 6x the sustainable
            rate for a 4.624% budget. At this burn the full compliance
            period's budget is gone in 1.0 hours of window-equivalents.
      - alert: AlertBudgetBurn3x
        expr: >
          netsentry:alert_ratio:rate1d > 0.138719
          and netsentry:alert_ratio:rate2h > 0.138719
        labels:
          severity: ticket
          long_window: 1d
          short_window: 2h
        annotations:
          summary: "Alert budget burning 3x too fast (1d/2h)"
          description: >
            The alert ratio over 1d (confirmed over 2h) exceeds
            13.872%, which is 3x the sustainable
            rate for a 4.624% budget. At this burn the full compliance
            period's budget is gone in 8.0 hours of window-equivalents.
      - alert: AlertBudgetBurn1x
        expr: >
          netsentry:alert_ratio:rate3d > 0.0462395
          and netsentry:alert_ratio:rate6h > 0.0462395
        labels:
          severity: ticket
          long_window: 3d
          short_window: 6h
        annotations:
          summary: "Alert budget burning 1x too fast (3d/6h)"
          description: >
            The alert ratio over 3d (confirmed over 6h) exceeds
            4.624%, which is 1x the sustainable
            rate for a 4.624% budget. At this burn the full compliance
            period's budget is gone in 72.0 hours of window-equivalents.
