# Small, fast overrides for the CI train-smoke test (synthetic data).
data:
  synthetic_rows: 5000
supervised:
  n_estimators: 80
anomaly:
  detectors: [iforest]   # no Torch in the CI image
  loao_min_samples: 30
seed_variance:
  n_seeds: 3             # 4 refits total (incl. the same-seed repro check) is plenty for CI
retrain_policy:
  n_batches: 4           # the tiny stream still exercises every trigger path
refresh:
  n_batches: 4           # match the retrain-policy stream at CI scale
adaptive_conformal:
  window: 200            # the 5k-row smoke's test stream needs smaller coverage windows
exemplars:
  per_class: 50          # a compact case base is plenty to exercise the retrieval
leaderboard:
  families: [majority, logistic, gbdt]  # one linear + the deployed family is enough smoke
selftrain:
  max_pseudo_per_class: 2000
sanitize:
  flip_rates: [0.0, 0.25]  # two points exercise both the tax and the recovery branch
  max_rows: 3000
dp:
  noise_multipliers: [0.0, 1.0, 4.0]  # non-private + two budgets exercises the frontier
  target_train_rows: 1500
  eval_rows: 800
  epochs: 20
transfer:
  label_budgets: [50, 500]  # one starved budget + one that begins to hold
  n_resamples: 5
socsim:
  n_runs: 3                # medians over 3 draws are enough to exercise the queue
  arrivals_per_shift: 120
  analyst_counts: [2, 4]   # one saturated setting + one nearer capacity
gate:
  min_tpr_at_primary_fpr: 0.0  # the 5k-row smoke is about the structural checks
  max_ece: 1.0
earliness:
  horizons_s: [0.1, 1.0, 60.0]   # three points are enough to exercise the frontier
hierarchy:
  min_class_rows: 5              # the 5k-row smoke has few rows per leaf class
defer:
  budget_fractions: [0.0, 0.01, 0.05]
  reference_rows: 500
invariance:
  penalty_weights: [0.0, 10.0]   # ERM plus one penalised arm exercises both branches
  steps: 40
monotonic:
  max_attack_flows: 100          # the greedy search and the verifier are both per-flow
  max_verify_flows: 100
  attack_rounds: [0, 1]
optimal_tree:
  penalties: [0.005, 0.02]
  n_features: 4                  # the search is exponential in the predicate count
  max_train_rows: 800
sketches:
  n_flows: 3000                  # pure-Python structures; enough to exercise every bound
  n_hosts: 200
  scanner_targets: 120
  hll_precisions: [6, 8]
  countmin_epsilons: [0.01, 0.001]
mmd:
  window_rows: 150                # the kernel is quadratic; 150 exercises every branch
  permutations: 39
  power_permutations: 19
  repeats: 3
  power_repeats: 3
  window_sweep: [100, 150]
  cost_sweep: [100, 150]
  dependence_rhos: [0.0, 0.9]     # the two ends of the dependence dial
  stream_features: 8
continual:
  max_rows_per_task: 700          # four tasks still form, each with both classes
  buffer_rows: 200
  buffer_sweep: [0, 400]          # naive fine-tune plus one buffered arm
  bench_rows: 200
online:
  warmup_rows: 1500
  max_stream_rows: 1200
  batch_rows: 400
  retrain_every: 800
  grace_period: 100               # the tree must be able to split inside a 1.2k-flow stream
  label_delays: [0, 1]
control:
  batch_rows: 150
  gain_sweep: [0.25, 1.0]
  delay_sweep: [0, 2]
  attack_start_batch: 2
  attack_batches: 3
  decoys_per_batch: 50
operating_point:
  max_train_rows: 800             # CI installs no torch: the incumbent arm runs alone
  epochs: 2
  batch_rows: 256
  budgets: [0.01, 0.05]
  train_budgets: [0.05]
deep_tabular:
  epochs: 4                       # CI installs no torch: only the tree/linear arms run
  max_train_rows: 1500
  data_fractions: [0.25, 1.0]
  hidden_sizes: [32]
  token_dim: 8
  n_heads: 2
  n_blocks: 1
secagg:
  shards_per_day: 2               # 6 sites: enough for a threshold and a dropout
  rounds: 2
  scale_bits_sweep: [8, 20, 48]   # both ends of the encoding window, and the cliff
  dropout_counts: [0, 1, 5]
  group_sizes: [1, 2]
  range_bounds: [0.05, 1.0]
  cost_sites: [4, 6]
  privacy_rounds: 1
  reference_benign_rows: 200
dp_synth:
  n_bins: 8
  epsilons: [1.0]
  structures: ["independent"]
  include_oracle_structure: false
  repeats: 1
  max_released_rows: 1500
  n_estimators: 40
  audited_structure: independent
  audited_epsilons: [1.0]
  audit_rows: 100
  audit_release_rows: 300
pretrain:
  epochs: 2                       # CI installs no torch: PCA + the controls still run
  embedding_dim: 8
  hidden_sizes: [16]
  max_pool_rows: 600
  label_budgets: [100, 0]
  repeats: 1
  boosted_estimators: 30
risk_control:
  alphas: [0.1, 0.5]
  n_trials: 10
  grid_size: 40
  multi_alphas: [0.25]
  volume_budgets: [0.01]
sampling:
  budgets: [0.05, 0.25]
  n_simulations: 20
slice_discovery:
  n_bins: 5
  beam: 8
  min_support: 40
  top_n: 5
batching:
  batch_sizes: [1, 8, 64]
  timing_repeats: 2
  n_estimators: 40
  arrival_rates: [50.0, 2000.0]
  wait_sweep_ms: [1.0, 5.0]
  n_requests: 2000
pareto:
  population_size: 4              # 4 x 2 evolves a front without a fifteen-minute CI job
  generations: 2
  n_weights: 2000
  max_train_rows: 800
psi:
  list_size: 40                   # 2048-bit exponentiations are the cost; 40 keeps CI honest
  overlap: 8
  hash_samples: 2000
  address_sample: 2000
  port_indicators: 10
  inflation_sizes: [20, 60]
  cost_sizes: [10, 20]
acquisition:
  n_estimators: 40
  max_train_rows: 1500
  bands: [0.05]
  keep_fractions: [0.1]
quantiles:
  stream_rows: 20000
  reservoir_sizes: [500, 5000]
  compressions: [50.0]
  histogram_bins: [1000]
density:
  methods:                          # CI installs no torch: the autoencoder arm is skipped
    - "isolation forest (deployed)"
    - "PCA reconstruction (linear autoencoder)"
    - "Mahalanobis distance (Gaussian density)"
    - "Gaussian mixture (diagonal)"
    - "vector norm (learns nothing)"
  max_attacks: 2
  max_train_rows: 1500
  kde_samples: 200
  gmm_components: 4
lifecycle:
  steps: 40                         # each reload builds a whole inference engine
  min_heavy: 2
  min_light: 2
bandit:
  max_flows: 2000
  n_repeats: 2
  alpha_sweep: [0.5, 1.0]
calibration_attack:
  fractions: [0.0, 0.01, 0.05]
  min_day_flows: 5
consistency:
  capped_rows: 400
  thin_trees: 20
  batches: 3
composition:
  psi_bins: 5
power:
  resamples: 40
  permutations: 40
claims:
  injections: 6
reuse:
  rounds: 6
  candidates_per_round: 4
  bootstrap_resamples: 40
  query_budget: 8
hull:
  budgets: [0.001, 0.01]            # the tight cut and the deployed one
  threshold_probabilities: [0.05, 0.2, 0.5]
  skew_points: 41
determinism:
  n_estimators: 30                  # every variant is a full refit
  thread_counts: [1, 2]
  batch_probe_rows: 50
side_channel:
  n_flows: 40                       # every request runs SHAP; 40 still separates the classes
  timing_repeats: 1
  field_flows: 20
universal:
  fit_rows: 60
  holdout_rows: 120
  steps: 6
  budget_sweep: [1.0, 4.0]
  transport_rows: 60
private_inference:
  n_bins: 8
  rounds: 10
  fraction_bit_sweep: [8, 20, 40]   # coarse, correct, and wrapped
  precision_flows: 4
  timing_flows: 4
  leak_flows: 6
  edge_features: 3
  extraction_features: 2
shap_estimand:
  max_flows: 60
  background_size: 40
  exact_features: 6                 # 64 coalitions keeps the brute-force reference honest
  exact_rounds: 20
  exact_background: 24
  exact_flows: 4
  neighbours: 8
multifidelity:
  max_train_rows: 1500
  max_rounds: 9                     # the ladder still has three rungs at CI scale
  fidelity_ladder: [1, 3, 9]
  budget_units: 90
  search_min_fidelity: 1
  repeats: 1
  rank_configs: 6
  curse_resamples: 50
attestation:
  max_flows: 120                    # every certificate walks the whole ensemble in Python
  timing_repeats: 5
  replay_trials: 20
  replay_epsilons: [0.000001, 0.01, 1.0]   # inside a leaf, on its edge, well outside
  leak_counts: [1, 20, 100]
gam:
  bin_ladder: [4, 16]               # two rungs still bracket a turn in the capacity curve
  round_ladder: [3, 30]
  rounds: 20
  pair_candidates: 6
  pair_ladder: [1, 4]
  pair_rounds: 20
  n_edits: 3
  min_removed: 1                    # the 5k-row smoke has very few alarms to select from
  recovery_rows: 800
  recovery_rounds: 60
transport:
  max_rows: 200                     # the coupling is quadratic in memory and cubic to solve
  projections: 32
  permutations: 39
  reg_scales: [0.5, 0.05]           # both ends of the centroid-to-partner dial
  max_iter: 100
  budgets: [1.0, 8.0]               # one budget inside the noise, one that moves detection
  adapt_rows: 400
mlflow:
  enabled: false         # use the local file logger in CI
